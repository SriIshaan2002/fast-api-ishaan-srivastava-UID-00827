name: Auto Format and Sort Imports

on:
  pull_request:
    branches: 
    - feature**

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Auto-Fix Linting Issues & Sort Imports
        run: ruff check --fix --exclude-migrations .

      - name: Auto-Format Code Style
        run: ruff format --exclude-migrations .

      - name: Commit and Push Clean Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and sort imports with ruff"
